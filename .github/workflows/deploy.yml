name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/sync-hero-photo.mjs
      - run: node scripts/sync-event-photos.mjs
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          EVENT_PHOTO_CATEGORY: wedding
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '/Sudipta' }}
          NEXT_PUBLIC_HERO_PHOTO_ENDPOINT: ${{ vars.NEXT_PUBLIC_HERO_PHOTO_ENDPOINT }}
          NEXT_PUBLIC_EVENT_PHOTOS_ENDPOINT: ${{ vars.NEXT_PUBLIC_EVENT_PHOTOS_ENDPOINT }}
          NEXT_PUBLIC_RSVP_ENDPOINT: ${{ vars.NEXT_PUBLIC_RSVP_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
